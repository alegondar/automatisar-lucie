# Project context (Reglas de Oro del proyecto)
context: |
  REGLAS DE ORO (obligatorias en todo el proyecto):
  1. PROHIBICIÓN DE BORRADO AUTOMÁTICO Y SOBRESCRITURA DESTRUCTIVA: Fuera de la excepción manual, el código NO puede contener ninguna operación de borrado ni pisado ciego sobre el pendrive ni sobre ~/Descargas (nada de os.remove, os.unlink, os.rmdir, os.removedirs, Path.unlink, Path.rmdir, shutil.rmtree, shutil.move, os.replace, send2trash ni subprocess/os.system con rm). Excepción: el usuario puede eliminar permanentemente archivos y carpetas seleccionados del pendrive desde la sección Eliminar capítulos del dashboard, solo con simulación previa, confirmación explícita, confinamiento, validación de identidad/contenido y registro append-only. No se permite borrar raíz, metadatos ni atravesar enlaces. Fuera de ese flujo, lo que sobra se mueve a _a_revisar o _enviados.
  2. SIMULACIÓN PREVIA OBLIGATORIA: Nada se ejecuta sin una simulación previa (dry-run) que muestre origen y destino exactos de cada acción.
  3. APROBACIÓN GRANULAR: Cada acción se aprueba una por una, o por grupo que el usuario elija. No existe un "hacer todo".
  4. VERIFICAR DESTINO (NUNCA SOBRESCRIBIR): Antes de mover o copiar, verificar que el destino no existe. Para copiar archivos, usar creación exclusiva (modo 'xb' o equivalente) para que falle si el destino ya existe. Nunca sobrescribir.
  5. VERIFICACIÓN DE HASH POST-COPIA Y REVERSIÓN SIN BORRAR: Después de copiar, recalcular el hash en el destino y compararlo con el origen. Si el hash no coincide, la copia defectuosa NUNCA se elimina; se mueve a _a_revisar/copias_fallidas/ y se registra en la bitácora.
  6. REGISTRO .JSONL Y DESHACER: Cada operación queda en un registro .jsonl. Los movimientos permiten deshacer; el borrado manual permanente no permite deshacer y debe indicarse antes de confirmar.
  7. TEST ANTI-BORRADO: Test automático estático (AST) que admite exclusivamente os.unlink(ruta) y os.rmdir(ruta) dentro de GestorEliminacionPendrive.ejecutar en bandeja/eliminacion.py, con pruebas dinámicas del flujo manual. En cualquier otro ámbito debe fallar ante una llamada prohibida de borrado o pisado en el código (os.remove, os.unlink, os.rmdir, os.removedirs, Path.unlink, Path.rmdir, shutil.rmtree, shutil.move, os.replace, send2trash, subprocess/os.system con rm).
  ESTADO IMPLEMENTADO (2026-10-11):
  - EXPORTS NUMÉRICOS SIN SESIÓN (2026-10-30): No copiarlos automáticamente con el número de CapCut a Sin publicar. Exigir sesión inequívoca o título/personaje explícitos, plan y confirmación con token de un uso. La copia usa personaje/mes/carpeta fechada/título y conserva el original. No renombrar históricos ni adivinar sesiones completadas. El retiro solicitado de crudos se sondea también sin carpeta de exports; Windows en uso conserva el original y su pendiente visible.
  - ORGANIZACIÓN MENSUAL (2026-10-19): Nuevas salidas de videos sin editar, ya editados, completos, imagenes y audios usan personaje/mes español - año/capítulo, conservando nombres de capítulos y las colas de completos. El usuario pidió organizar también los existentes, incluidas imágenes y audio: simular el grupo seleccionado, verificar identidad/estructura/hash/archivos libres, registrar y permitir Deshacer; nunca fusionar, sobrescribir ni borrar. Mes explícito del nombre o registro inequívoco; fecha desconocida exige elección. Listar/arrancar no migra. Las referencias históricas se resuelven por prefijos registrados y se mantienen sesiones de audio, reintentos y reversión.
  - Salidas de edición: categoria/personaje/nombre - mes español - año/, con videos directamente dentro; sin semana ni subcarpetas de capítulo. No migrar estructuras anteriores automáticamente.
  - CapCut conserva sus originales. La copia recibe el nombre de la sesión. Regla autorizada 2026-10-12: una única sesión en_edicion pendiente tiene prioridad sobre editadas antiguas; varias en_edicion exigen elección. Sin en_edicion, solo una única editada pendiente permite asociación automática. El modo automático retoma un único export vigente sin asignar generado desde el inicio de esa única edición; no asocia históricos ni elige entre varios exports recientes.
  - El envío automático de exports corresponde a autorización expresa del usuario para ese flujo específico, conservando colisiones, hash, registro y reversión; no extiende permisos a otras acciones. envio_exports_capcut=manual exige envío explícito desde Videos completados.
  - CIERRE Y EXPORT (2026-10-14): Terminé de editar organiza los clips y revisa el único export vigente para copiarlo a videos completos/videos sin publicar en modo automático. La sesión terminada sin copia queda visible con Revisar video final. Se retoma la revisión tras reiniciar; un export preexistente solo puede recuperarse dentro de la ventana confirmada de esa sesión, con estabilidad y exclusividad. Varios candidatos o ventanas superpuestas requieren elección explícita. Mantener modo manual, históricos ajenos y bloqueo de reenvío tras Deshacer. El dashboard no ejecuta la exportación del proyecto dentro de CapCut.
  - Pruebas herméticas exclusivamente temporales. No tocar Descargas, CapCut ni pendrive reales; para la suite solo contar el manifiesto en lectura antes/después, y detenerse si cambia.
  - Windows usa CreateFileW sin compartir para comprobar exclusividad; Linux conserva fcntl.flock. Preservar ambos sistemas.
  - Consultar ESTADO_ACTUAL.md para módulos, API, estados, reintentos, deshacer, reproducción y evidencia de validación; no confundir propuestas históricas con el comportamiento actual.
  - EXCEPCIÓN AUTORIZADA DE CARPETAS VACÍAS (2026-10-12): Tras un envío exitoso con copias verificadas y registros escritos, se permite exclusivamente os.rmdir(ruta) en _limpiar_carpetas_vacias_enviadas de bandeja/pendrive.py para subcarpetas vacías y raíz del capítulo enviado dentro de la sala de espera. No se borran archivos, personajes, raíz de espera, respaldos, capítulos ajenos ni enlaces/junctions. El resultado informa las carpetas retiradas; deshacer recrea los directorios necesarios. La prohibición de borrado automático de material sigue vigente.
  - NOMBRES VIGENTES (2026-10-12): Carpetas nuevas de capítulos del dashboard y salidas de edición usan nombre - día de semana español - semana del mes - mes español - año. Semana del mes por bloques 1–7, 8–14, 15–21, 22–28, 29–31; reloj local. Sustituye solo mes/año, sin niveles anidados ni migración de rutas históricas.
  - TÍTULOS LEGIBLES (2026-10-15): Sugerencias de edición y nuevos completos conservan espacios, acentos y mayúsculas. Quitar del título base los sufijos generados videocompleto y fecha documentada heredada, también pegados; carpeta con una fecha vigente y archivo con solo título y extensión. Ya editados conserva videoyaeditado_... con guiones bajos. Recuperar espacios antiguos solo si capítulo/clip conserva el mismo título legible. No renombrar material existente; respetar rutas históricas en reintentos y Deshacer.
  - EXCEPCIÓN PARA YA EDITADOS (2026-10-12): Nuevas carpetas de crudos editados usan videoyaeditado_<nombre>_semana_<del mes>_<mes español>_<año>, quitando el sufijo videocompleto del nombre base. Se conserva el personaje contenedor. Videos completos y capítulos conservan el formato anterior vigente; manifiesto, reintentos y deshacer respetan rutas históricas sin renombrarlas.
  - PUBLICACIÓN WI-FI AUTORIZADA (2026-10-12): Nuevos completos se resguardan en videos completos/videos sin publicar. Los exports sin sesión se conservan por nombre/versionado sin asignación ficticia. El envío seleccionado, simulado y confirmado desde el dashboard a un receptor LocalSend usa SHA-256 y su aceptación/confirmación. Solo después se traslada a videos completos/videosPublicados/<personaje> sin sobrescritura, actualizando rutas y registrando reversión. La recepción se considera señal de publicación por elección del usuario; no se consulta Instagram. Rechazos, cancelación, desconexión o checksum fallido conservan los no recibidos en la cola. No migrar material histórico automáticamente.

